platforms:
    only:
        - aarch64
        - x86_64
flatpak:
    id: com.google.Chrome
    branch: stable
    runtime-name: flatpak-runtime
    runtime-version: f44
    name: google-chrome
    tags: [proprietary]
    packages:
        #- dconf
        - google-chrome-flatpak-config
        - zypak
    command: chrome
    extra-data:
        - filename: google-chrome-stable-151.0.7922.108-1.aarch64.rpm
          url: https://dl.google.com/linux/chrome/rpm/stable/aarch64/google-chrome-stable-151.0.7922.108-1.aarch64.rpm
          sha256: cb603e40394b4230eb44f858dbb25da9d3eeeabc0de79f82d474087a997a65c0
          size: 134743477
          only-arches:
              - aarch64
        - filename: google-chrome-stable-151.0.7922.108-1.x86_64.rpm
          url: https://dl.google.com/linux/chrome/rpm/stable/x86_64/google-chrome-stable-151.0.7922.108-1.x86_64.rpm
          sha256: 531c407f998f4441c503f133c5e751538048252ed691d72bff2d73fcc5b88101
          size: 143618241
          only-arches:
              - x86_64
    finish-args: |-
        --device=all
        --share=ipc
        --share=network
        --socket=cups
        --socket=pcsc
        --socket=pulseaudio
        --socket=x11
        --socket=wayland
        --require-version=1.8.2
        --system-talk-name=org.bluez
        --system-talk-name=org.freedesktop.Avahi
        --system-talk-name=org.freedesktop.UPower
        --talk-name=org.cinnamon.ScreenSaver
        --talk-name=org.freedesktop.FileManager1
        --talk-name=org.freedesktop.Notifications
        --talk-name=org.freedesktop.ScreenSaver
        --talk-name=org.freedesktop.secrets
        --talk-name=org.gnome.ScreenSaver
        --talk-name=org.gnome.SessionManager
        --talk-name=org.kde.StatusNotifierWatcher
        --talk-name=org.kde.kwalletd5
        --talk-name=org.kde.kwalletd6
        --talk-name=org.mate.ScreenSaver
        --talk-name=org.xfce.ScreenSaver
        --own-name=org.mpris.MediaPlayer2.chromium.*
        --filesystem=/run/.heim_org.h5l.kcm-socket
        --filesystem=host-etc
        --filesystem=xdg-run/pipewire-0:ro
        --filesystem=xdg-documents
        --filesystem=xdg-download
        --filesystem=xdg-music
        --filesystem=xdg-videos
        --filesystem=xdg-pictures
        --filesystem=~/.config/kioslaverc
    #        --env=GTK_PATH=/app/lib64/gtkmodules
    #        --filesystem=xdg-run/dconf
    #        --filesystem=~/.config/dconf:ro
    #        --talk-name=ca.desrt.dconf
    #        --env=DCONF_USER_CONFIG_DIR=.config/dconf
    #        --env=GIO_EXTRA_MODULES=/app/lib64/gio/modules
    #        --env=GSETTINGS_BACKEND=dconf
